<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>코알라 낙하 게임 - 카운트다운</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <div id="score-board">Score: <span id="score">0</span></div>
        
        <div id="game-board">
            <div id="koala">🐨</div>
        </div>

        <div id="overlay">
            <h1 id="title">Koala Fall</h1>
            <div id="countdown-text" style="font-size: 80px; font-weight: bold; color: #e74c3c; margin: 20px 0;"></div>
            <p id="sub-text">부엉이를 딛고 살아남으세요!</p>
            <button id="start-btn" onclick="startSequence()">게임 시작</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
